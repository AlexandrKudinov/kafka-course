services:
  practical6-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: practical6-zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost 2181 20"]
      interval: 5s
      timeout: 10s
      retries: 20

  practical6-kafka-0:
    image: confluentinc/cp-kafka:7.6.1
    container_name: practical6-kafka-0
    hostname: kafka-0
    depends_on:
      practical6-zookeeper:
        condition: service_healthy
    ports:
      - "19092:19092"
    volumes:
      - practical6-kafka-0-data:/var/lib/kafka/data
      - ./practical-6/certs:/etc/kafka/secrets:ro
      - ./practical-6/config/admin.properties:/tmp/admin.properties:ro
      - ./practical-6/config/producer.properties:/tmp/producer.properties:ro
      - ./practical-6/config/consumer.properties:/tmp/consumer.properties:ro
    environment:
      KAFKA_BROKER_ID: 0
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL_SSL:SSL,EXTERNAL_SSL:SSL
      KAFKA_LISTENERS: INTERNAL_SSL://0.0.0.0:9093,EXTERNAL_SSL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL_SSL://kafka-0:9093,EXTERNAL_SSL://localhost:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL_SSL
      KAFKA_SSL_KEYSTORE_FILENAME: kafka-0.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka-0.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: "RULE:^CN=([^,]+).*$/$1/,DEFAULT"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: User:admin;User:kafka-0;User:kafka-1;User:kafka-2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-0:9093 --command-config /tmp/admin.properties >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  practical6-kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: practical6-kafka-1
    hostname: kafka-1
    depends_on:
      practical6-zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"
