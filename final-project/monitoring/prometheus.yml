global:
  scrape_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: kafka
    static_configs:
      - targets: ["jmx-kafka-0:5556", "jmx-kafka-1:5556", "jmx-kafka-2:5556"]
  - job_name: kafka-connect
    static_configs:
      - targets: ["jmx-connect:5556"]
