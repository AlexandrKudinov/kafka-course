services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    hostname: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "32181:2181"
    healthcheck:
      test: [ "CMD-SHELL", "cub zk-ready localhost 2181 20" ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  kafka-0:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-0
    hostname: kafka-0
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "19092:19092"
    volumes:
      - kafka-0-data:/var/lib/kafka/data
      - ./final-project/certs:/etc/kafka/secrets:ro
      - ./final-project/config:/etc/kafka/client-config:ro
    environment:
      KAFKA_BROKER_ID: 0
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL_SSL:SSL,EXTERNAL_SSL:SSL
      KAFKA_LISTENERS: INTERNAL_SSL://0.0.0.0:9093,EXTERNAL_SSL://0.0.0.0:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL_SSL://kafka-0:9093,EXTERNAL_SSL://localhost:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL_SSL
      KAFKA_SSL_KEYSTORE_FILENAME: kafka-0.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka-0.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: "RULE:^CN=([^,]+).*$/$1/,DEFAULT"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: User:admin;User:kafka-0;User:kafka-1;User:kafka-2;User:connect
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_JMX_PORT: 9990
      KAFKA_JMX_HOSTNAME: kafka-0
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.rmi.port=9990 -Djava.rmi.server.hostname=kafka-0"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-0:9093 --command-config /etc/kafka/client-config/admin.properties >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-1
    hostname: kafka-1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "29092:29092"
    volumes:
      - kafka-1-data:/var/lib/kafka/data
      - ./final-project/certs:/etc/kafka/secrets:ro
      - ./final-project/config:/etc/kafka/client-config:ro
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL_SSL:SSL,EXTERNAL_SSL:SSL
      KAFKA_LISTENERS: INTERNAL_SSL://0.0.0.0:9093,EXTERNAL_SSL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL_SSL://kafka-1:9093,EXTERNAL_SSL://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL_SSL
      KAFKA_SSL_KEYSTORE_FILENAME: kafka-1.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka-1.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: "RULE:^CN=([^,]+).*$/$1/,DEFAULT"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: User:admin;User:kafka-0;User:kafka-1;User:kafka-2;User:connect
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_JMX_PORT: 9991
      KAFKA_JMX_HOSTNAME: kafka-1
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.rmi.port=9991 -Djava.rmi.server.hostname=kafka-1"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-1:9093 --command-config /etc/kafka/client-config/admin.properties >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-2
    hostname: kafka-2
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "39092:39092"
    volumes:
      - kafka-2-data:/var/lib/kafka/data
      - ./final-project/certs:/etc/kafka/secrets:ro
      - ./final-project/config:/etc/kafka/client-config:ro
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL_SSL:SSL,EXTERNAL_SSL:SSL
      KAFKA_LISTENERS: INTERNAL_SSL://0.0.0.0:9093,EXTERNAL_SSL://0.0.0.0:39092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL_SSL://kafka-2:9093,EXTERNAL_SSL://localhost:39092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL_SSL
      KAFKA_SSL_KEYSTORE_FILENAME: kafka-2.keystore.jks
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_TRUSTSTORE_FILENAME: kafka-2.truststore.jks
      KAFKA_SSL_TRUSTSTORE_CREDENTIALS: truststore_creds
      KAFKA_SSL_CLIENT_AUTH: required
      KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM: https
      KAFKA_SSL_PRINCIPAL_MAPPING_RULES: "RULE:^CN=([^,]+).*$/$1/,DEFAULT"
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_SUPER_USERS: User:admin;User:kafka-0;User:kafka-1;User:kafka-2;User:connect
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_JMX_PORT: 9992
      KAFKA_JMX_HOSTNAME: kafka-2
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.rmi.port=9992 -Djava.rmi.server.hostname=kafka-2"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka-2:9093 --command-config /etc/kafka/client-config/admin.properties >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  secondary-zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: secondary-zookeeper
    hostname: secondary-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "42181:2181"
    healthcheck:
      test: [ "CMD-SHELL", "cub zk-ready localhost 2181 20" ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  secondary-kafka-0:
    image: confluentinc/cp-kafka:7.6.1
    container_name: secondary-kafka-0
    hostname: secondary-kafka-0
    restart: unless-stopped
    depends_on:
      secondary-zookeeper:
        condition: service_healthy
    ports:
      - "49092:49092"
    environment:
      KAFKA_BROKER_ID: 10
      KAFKA_ZOOKEEPER_CONNECT: secondary-zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:49092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://secondary-kafka-0:9092,EXTERNAL://localhost:49092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server secondary-kafka-0:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  secondary-kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: secondary-kafka-1
    hostname: secondary-kafka-1
    restart: unless-stopped
    depends_on:
      secondary-zookeeper:
        condition: service_healthy
    ports:
      - "59092:59092"
    environment:
      KAFKA_BROKER_ID: 11
      KAFKA_ZOOKEEPER_CONNECT: secondary-zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:59092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://secondary-kafka-1:9092,EXTERNAL://localhost:59092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server secondary-kafka-1:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  secondary-kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: secondary-kafka-2
    hostname: secondary-kafka-2
    restart: unless-stopped
    depends_on:
      secondary-zookeeper:
        condition: service_healthy
    ports:
      - "6092:6092"
    environment:
      KAFKA_BROKER_ID: 12
      KAFKA_ZOOKEEPER_CONNECT: secondary-zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:6092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://secondary-kafka-2:9092,EXTERNAL://localhost:6092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server secondary-kafka-2:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  connect:
    image: confluentinc/cp-kafka-connect:7.6.1
    container_name: connect
    hostname: connect
    restart: unless-stopped
    depends_on:
      kafka-0:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    ports:
      - "8084:8083"
      - "9404:9404"
    volumes:
      - ./final-project/certs:/etc/kafka/secrets:ro
      - ./final-project/storage:/data/final-project/storage
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka-0:9093,kafka-1:9093,kafka-2:9093
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_GROUP_ID: final-project-connect
      CONNECT_CONFIG_STORAGE_TOPIC: _final_connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _final_connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: _final_connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 3
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_PORT: 8083
      CONNECT_SECURITY_PROTOCOL: SSL
      CONNECT_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/client.truststore.jks
      CONNECT_SSL_TRUSTSTORE_PASSWORD: password
      CONNECT_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/connect.keystore.jks
      CONNECT_SSL_KEYSTORE_PASSWORD: password
      CONNECT_SSL_KEY_PASSWORD: password
      KAFKA_JMX_PORT: 9404
      KAFKA_JMX_HOSTNAME: connect
      KAFKA_JMX_OPTS: "-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Dcom.sun.management.jmxremote.rmi.port=9404 -Djava.rmi.server.hostname=connect"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  jmx-kafka-0:
    image: bitnami/jmx-exporter:latest
    container_name: jmx-kafka-0
    restart: unless-stopped
    command: [ "5556", "/config.yml" ]
    ports:
      - "5556:5556"
    volumes:
      - ./final-project/monitoring/jmx-kafka-0.yml:/config.yml:ro
    depends_on:
      kafka-0:
        condition: service_healthy

  jmx-kafka-1:
    image: bitnami/jmx-exporter:latest
    container_name: jmx-kafka-1
    restart: unless-stopped
    command: [ "5556", "/config.yml" ]
    ports:
      - "5557:5556"
    volumes:
      - ./final-project/monitoring/jmx-kafka-1.yml:/config.yml:ro
    depends_on:
      kafka-1:
        condition: service_healthy

  jmx-kafka-2:
    image: bitnami/jmx-exporter:latest
    container_name: jmx-kafka-2
    restart: unless-stopped
    command: [ "5556", "/config.yml" ]
    ports:
      - "5558:5556"
    volumes:
      - ./final-project/monitoring/jmx-kafka-2.yml:/config.yml:ro
    depends_on:
      kafka-2:
        condition: service_healthy

  jmx-connect:
    image: bitnami/jmx-exporter:latest
    container_name: jmx-connect
    restart: unless-stopped
    command: [ "5556", "/config.yml" ]
    ports:
      - "5559:5556"
    volumes:
      - ./final-project/monitoring/jmx-connect.yml:/config.yml:ro
    depends_on:
      connect:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    restart: unless-stopped
    depends_on:
      jmx-kafka-0:
        condition: service_started
      jmx-kafka-1:
        condition: service_started
      jmx-kafka-2:
        condition: service_started
      jmx-connect:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      - ./final-project/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./final-project/monitoring/rules.yml:/etc/prometheus/rules.yml:ro

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./final-project/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    volumes:
      - ./final-project/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./final-project/grafana/provisioning:/etc/grafana/provisioning:ro

volumes:
  kafka-0-data:
  kafka-1-data:
  kafka-2-data:
